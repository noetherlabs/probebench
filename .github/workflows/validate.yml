name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.11'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check repository content
        run: uv run --locked python scripts/check_repository.py
      - name: Run tests
        run: uv run --locked python -m pytest -q --ignore=tests/test_installed_wheel.py
      - name: Verify retained experiments
        run: |
          uv run --locked python -m probebench.run --verify results/development-20261014
          uv run --locked python -m probebench.qualification --verify results/noise-qualification-20261014
          uv run --locked python -m probebench.sequential --verify results/sequential-calibration-20261014
          uv run --locked python -m probebench.sequential --verify results/measurement-schedule-20261014
      - name: Build and install the ordinary wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/probebench-dist"
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/installed-requirements.txt"
          uv venv --python 3.11 "$RUNNER_TEMP/probebench-installed"
          installed_python="$RUNNER_TEMP/probebench-installed/bin/python"
          uv pip install --python "$installed_python" --require-hashes -r "$RUNNER_TEMP/installed-requirements.txt"
          uv run --locked python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          wheels = list((root / "probebench-dist").glob("noether_probebench-*.whl"))
          assert len(wheels) == 1
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          (root / "project-wheel.txt").write_text(wheel.as_uri() + " --hash=sha256:" + digest + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("PROBEBENCH_INSTALLED_WHEEL=" + str(wheel) + "\n")
              stream.write("PROBEBENCH_INSTALLED_PYTHON=" + str(root / "probebench-installed/bin/python") + "\n")
          PYTHON
          uv pip install --python "$installed_python" --no-index --require-hashes -r "$RUNNER_TEMP/project-wheel.txt" -r "$RUNNER_TEMP/installed-requirements.txt"
          uv pip check --python "$installed_python"
      - name: Exercise installed model-session transport and replay
        run: |
          uv run --locked python -m pytest -q tests/test_installed_wheel.py --junitxml="$RUNNER_TEMP/installed-wheel.xml"
          uv run --locked python - <<'PYTHON'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / "installed-wheel.xml").iter("testcase"))
          assert len(cases) == 1
          assert all(cases[0].find(tag) is None for tag in ("failure", "error", "skipped"))
          PYTHON
